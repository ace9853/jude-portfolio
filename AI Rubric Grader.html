<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AI Rubric Grader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: two-pane marking desk. Inputs on the left (the script), marks on the right (the grading sheet). Stacks on phones. */
:root{
  --bg:#F2F4F7; --panel:#FFFFFF; --ink:#131925; --muted:#5D6677; --line:#DCE1E8;
  --pen:#2B57C4; --pen-soft:#E6ECFA; --good:#1C7C4A; --mid:#B26B00; --low:#C0392B;
  --display:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1218; --panel:#161C25; --ink:#E4E9F1; --muted:#98A2B3; --line:#273041;
  --pen:#7FA2F5; --pen-soft:#1C2740; --good:#4CC58A; --mid:#E9A53A; --low:#F07A6C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1218; --panel:#161C25; --ink:#E4E9F1; --muted:#98A2B3; --line:#273041;
  --pen:#7FA2F5; --pen-soft:#1C2740; --good:#4CC58A; --mid:#E9A53A; --low:#F07A6C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
h1{font:800 clamp(1.7rem,4vw,2.4rem)/1.1 var(--display);margin:0;letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font:600 1.05rem var(--display);margin:0}
label{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
textarea,input{width:100%;font:15px/1.5 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--pen);outline-offset:1px}
textarea{resize:vertical}
.crit-list{display:flex;flex-direction:column;gap:10px}
.crit{display:grid;grid-template-columns:1fr 72px 36px;gap:8px;align-items:start}
.crit .desc{grid-column:1/3}
.crit input.pts{text-align:center;font-family:var(--mono)}
.icon{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;height:42px;cursor:pointer;font-size:18px}
.icon:hover{color:var(--low);border-color:var(--low)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:600 15px var(--body);border-radius:8px;padding:11px 18px;cursor:pointer;border:1px solid var(--pen)}
.btn.primary{background:var(--pen);color:var(--panel)}
.btn.primary:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--pen)}
.hint{font-size:13px;color:var(--muted)}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--low)}

/* Grading sheet */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font:800 3.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.score .of{font:500 1.1rem var(--mono);color:var(--muted)}
.grade{font:600 13px var(--mono);padding:3px 10px;border-radius:999px;background:var(--pen-soft);color:var(--pen)}
.tag{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mid);border:1px dashed var(--mid);border-radius:4px;padding:1px 6px}
.marks{display:flex;flex-direction:column;gap:16px}
.mark{display:flex;flex-direction:column;gap:6px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.mark:last-child{border-bottom:0;padding-bottom:0}
.mark .head{display:flex;justify-content:space-between;gap:12px;font-weight:600}
.mark .pts{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.mark p{margin:0;color:var(--muted);font-size:14px;max-width:65ch}
.feedback{background:var(--pen-soft);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback h3{margin:0;font:600 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--pen)}
.feedback p,.feedback ul{margin:0;font-size:14px}
.feedback ul{padding-left:18px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .6s ease}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>AI Rubric Grader</h1>
      <p>Paste a question, an answer and a marking rubric. The grader scores each criterion and explains why, the same way human AI trainers rate model responses.</p>
    </div>
  </header>

  <div class="grid">
    <form class="panel" id="form">
      <h2>The script</h2>
      <div><label for="q">Question</label><textarea id="q" rows="2"></textarea></div>
      <div><label for="a">Answer to grade</label><textarea id="a" rows="6"></textarea></div>
      <div>
        <label>Rubric</label>
        <div class="crit-list" id="crits"></div>
      </div>
      <div class="row">
        <button class="btn ghost" type="button" id="addCrit">+ Add criterion</button>
        <span class="hint" id="totalHint"></span>
      </div>
      <div class="row">
        <button class="btn primary" type="submit" id="gradeBtn">Grade answer</button>
        <span class="status" id="status" role="status"></span>
      </div>
    </form>

    <section class="panel" id="sheet" aria-live="polite"></section>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const state = {
  question: "Explain the difference between a stack and a queue, with one real-world example of each.",
  answer: "A stack is LIFO, last in first out, like a pile of plates where you take the top one first. A queue is also LIFO but you add at the back, like people waiting at a bank. Stacks are used for undo in apps.",
  criteria: [
    {name:"Correctness", desc:"Definitions of stack and queue are accurate", max:4},
    {name:"Examples", desc:"One fitting real-world example for each structure", max:3},
    {name:"Clarity", desc:"Clear, concise and well organised", max:3}
  ]
};
const sampleResult = {
  sample:true,
  criteria:[
    {name:"Correctness", score:2, max:4, reasoning:"The stack is correctly described as LIFO, but the queue is wrongly called LIFO. A queue is FIFO: first in, first out."},
    {name:"Examples", score:3, max:3, reasoning:"Plates for a stack and a bank line for a queue both fit, and the undo feature is a good extra."},
    {name:"Clarity", score:2, max:3, reasoning:"Short and readable, but the queue sentence contradicts itself, which would confuse a reader."}
  ],
  feedback:"Good examples, but one key fact is wrong. Fixing the queue definition would move this to a strong answer.",
  improvements:["State that a queue is FIFO: first in, first out.","Add one sentence contrasting where items are removed: top for a stack, front for a queue."]
};

function renderCrits(){
  const box = $("#crits"); box.innerHTML = "";
  state.criteria.forEach((c,i)=>{
    const el = document.createElement("div"); el.className="crit";
    el.innerHTML = `<input id="cn${i}" aria-label="Criterion name" placeholder="Criterion">
      <input id="cm${i}" class="pts" type="number" min="1" max="20" aria-label="Max points">
      <button class="icon" type="button" aria-label="Remove criterion">×</button>
      <input id="cd${i}" class="desc" aria-label="What earns full marks" placeholder="What earns full marks">`;
    const [n,m,del,d] = el.children;
    n.value=c.name; m.value=c.max; d.value=c.desc;
    n.oninput=()=>c.name=n.value; d.oninput=()=>c.desc=d.value;
    m.oninput=()=>{c.max=Math.max(1,Math.min(20,parseInt(m.value)||1));totals()};
    del.onclick=()=>{ if(state.criteria.length>1){state.criteria.splice(i,1);renderCrits()} };
    box.appendChild(el);
  });
  totals();
}
function totals(){ $("#totalHint").textContent = `Total: ${state.criteria.reduce((s,c)=>s+(+c.max||0),0)} points`; }

function gradeLabel(p){ return p>=0.85?"Excellent":p>=0.7?"Good":p>=0.5?"Fair":"Needs work"; }
function colorFor(p){ return p>=0.75?"var(--good)":p>=0.5?"var(--mid)":"var(--low)"; }
function esc(s){ const d=document.createElement("div"); d.textContent=String(s??""); return d.innerHTML; }

function renderSheet(r){
  const total = r.criteria.reduce((s,c)=>s+c.score,0), max = r.criteria.reduce((s,c)=>s+c.max,0);
  const p = max? total/max : 0;
  $("#sheet").innerHTML = `
    <div class="row" style="justify-content:space-between"><h2>Grading sheet</h2>${r.sample?'<span class="tag">Sample result</span>':''}</div>
    <div class="score"><span class="big">${total}</span><span class="of">/ ${max}</span><span class="grade">${gradeLabel(p)} · ${Math.round(p*100)}%</span></div>
    <div class="marks">${r.criteria.map(c=>{const cp=c.max?c.score/c.max:0;return `
      <div class="mark"><div class="head"><span>${esc(c.name)}</span><span class="pts">${c.score} / ${c.max}</span></div>
      <div class="bar"><i style="width:${cp*100}%;background:${colorFor(cp)}"></i></div>
      <p>${esc(c.reasoning)}</p></div>`}).join("")}</div>
    <div class="feedback"><h3>Overall</h3><p>${esc(r.feedback)}</p>
      ${r.improvements?.length?`<h3>To improve</h3><ul>${r.improvements.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div>`;
}

// The grading call. To run outside claude.ai, replace this with a call to your own AI API.
async function gradeAnswer(sample, question, answer, criteria){
  const prompt = `You are a strict but fair grader. Score the ANSWER to the QUESTION against each rubric criterion.
Give whole-number scores from 0 to the criterion's max. Justify each score in 1-2 plain sentences that point to what the answer did or missed.
Return only JSON in this shape:
{"criteria":[{"name":string,"score":number,"max":number,"reasoning":string}],"feedback":string,"improvements":[string]}
Use the criteria in the order given. "feedback" is one or two sentences. "improvements" has 1-3 short, concrete fixes.

QUESTION:
${question}

ANSWER:
${answer}

RUBRIC:
${criteria.map((c,i)=>`${i+1}. ${c.name} (max ${c.max}): ${c.desc}`).join("\n")}`;
  const r = await sample.json(prompt, {modelTier:"default"});
  // Trust our own rubric, not the model, for names and max points.
  return {
    criteria: criteria.map((c,i)=>{
      const m = (r.criteria||[])[i] || {};
      const score = Math.max(0, Math.min(c.max, Math.round(Number(m.score)||0)));
      return {name:c.name, max:c.max, score, reasoning:m.reasoning||"No reasoning returned."};
    }),
    feedback: r.feedback||"", improvements: Array.isArray(r.improvements)? r.improvements.slice(0,3):[]
  };
}

let sampleCap = null;
$("#q").value = state.question; $("#a").value = state.answer;
renderCrits(); renderSheet(sampleResult);

(async ()=>{
  sampleCap = await (window.claude?.use ? window.claude.use("sample") : null);
  if(!sampleCap){
    $("#gradeBtn").disabled = true;
    $("#status").textContent = "AI grading isn't available in this view.";
  }
})();

$("#addCrit").onclick = ()=>{ state.criteria.push({name:"",desc:"",max:2}); renderCrits(); };
$("#form").addEventListener("submit", async e=>{
  e.preventDefault();
  const q=$("#q").value.trim(), a=$("#a").value.trim();
  const crits = state.criteria.filter(c=>c.name.trim());
  const st=$("#status"); st.className="status";
  if(!q||!a){ st.textContent="Add a question and an answer first."; st.className="status err"; return; }
  if(!crits.length){ st.textContent="Name at least one rubric criterion."; st.className="status err"; return; }
  if(!sampleCap) return;
  const btn=$("#gradeBtn"); btn.disabled=true; st.textContent="Grading…";
  try{
    renderSheet(await gradeAnswer(sampleCap, q, a, crits));
    st.textContent="Graded.";
  }catch(err){
    st.className="status err";
    st.textContent = err?.code==="rate_limited" ? "Too many requests. Wait a minute and try again."
      : err?.code==="not_granted" ? "AI grading was not allowed for this page."
      : "Grading failed. Try again, or shorten the answer.";
  }finally{ btn.disabled=false; }
});
</script>

</body></html>
